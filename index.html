<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AZEL App</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090e">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
body { background-color: #07090e; color: #e6edf3; font-family: -apple-system, sans-serif; user-select: none; }
.emerald-card { background: #111622; border: 1px solid rgba(255, 255, 255, 0.08); }
.page-content { display: none; }
.page-content.active { display: block; }
.gradient-banner {
background: linear-gradient(135deg, #10b981 0%, #043829 50%, #111622 100%);
border: 1px solid rgba(16, 185, 129, 0.3);
}
.invite-gradient-card {
background: linear-gradient(135deg, #10b981 0%, #059669 50%, #043829 100%);
border: 1px solid rgba(16, 185, 129, 0.4);
box-shadow: 0 10px 25px rgba(16, 185, 129, 0.15);
}
#auth-screen { display: flex; position: fixed; inset: 0; background: #07090e; z-index: 100; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
#main-app-wrapper { display: none; }

/* KARTICE: SLIKA LIJEVO, PANEL DESNO */
.bot-box-card {
    background: #111622;
    border-radius: 1rem;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.card-theme-1 { border: 1px solid rgba(16, 185, 129, 0.4); }
.card-theme-2 { border: 1px solid rgba(59, 130, 246, 0.4); }
.card-theme-3 { border: 1px solid rgba(168, 85, 247, 0.4); }
.card-theme-4 { border: 1px solid rgba(236, 72, 153, 0.4); }
.card-theme-5 { border: 1px solid rgba(249, 115, 22, 0.5); }
.card-theme-6 { border: 1px solid #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.25); background: linear-gradient(135deg, #1b070b 0%, #111622 70%); }

/* OZBILJNE ROBOT SLIKE SA LIJEVE STRANE */
.robot-pic-left {
    width: 110px;
    height: 135px;
    border-radius: 10px;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
}

.pic-bot-1 { background-image: url('https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=500&auto=format&fit=crop&q=80'); }
.pic-bot-2 { background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=80'); }
.pic-bot-3 { background-image: url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=500&auto=format&fit=crop&q=80'); }
.pic-bot-4 { background-image: url('https://images.unsplash.com/photo-1614064641938-3bbee52942c7?w=500&auto=format&fit=crop&q=80'); }
.pic-bot-5 { background-image: url('https://images.unsplash.com/photo-1563089145-599997674d42?w=500&auto=format&fit=crop&q=80'); }
.pic-bot-6 { background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&auto=format&fit=crop&q=80'); filter: contrast(1.2); }

.info-panel-right {
    background: #090d16;
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 8px 10px;
    flex-grow: 1;
}
</style>
</head>
<body class="pb-24">

<!-- LOGIN / REGISTRATION SCREEN -->
<div id="auth-screen">
    <div class="emerald-card p-6 rounded-3xl w-full max-w-sm space-y-4 bg-[#07090e] border border-emerald-500/40 shadow-2xl">
        <div class="text-center space-y-1">
            <div class="w-12 h-12 rounded-2xl bg-emerald-500 flex items-center justify-center font-bold text-black text-xl mx-auto shadow-lg shadow-emerald-500/30 mb-2">A</div>
            <h1 class="text-2xl font-bold text-emerald-400">AZEL</h1>
            <p class="text-xs text-gray-400">Bot Investment & Network Platform</p>
        </div>

        <div class="flex bg-gray-900 p-1 rounded-xl border border-gray-800">
            <button id="tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-black transition" data-i18n="loginTab">Log In</button>
            <button id="tab-reg-btn" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 transition" data-i18n="registerTab">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="form-login" class="space-y-3 text-xs">
            <div>
                <label class="text-[10px] text-emerald-400 font-bold mb-1 block" data-i18n="usernameLabel">Username</label>
                <input type="text" id="login-username" placeholder="Enter username..." class="w-full bg-gray-900 border border-emerald-500/30 p-3 rounded-xl text-white focus:outline-none focus:border-emerald-400">
            </div>
            <div>
                <label class="text-[10px] text-emerald-400 font-bold mb-1 block" data-i18n="passwordLabel">Password</label>
                <input type="password" id="login-password" placeholder="Enter password..." class="w-full bg-gray-900 border border-emerald-500/30 p-3 rounded-xl text-white focus:outline-none focus:border-emerald-400">
            </div>
            <button onclick="handleUserLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-xl text-xs shadow-lg shadow-emerald-500/20 active:scale-95 transition mt-2" data-i18n="loginBtn">
                Log In
            </button>
        </div>

        <!-- REGISTER FORM -->
        <div id="form-register" class="space-y-2.5 text-xs" style="display: none;">
            <div>
                <label class="text-[10px] text-emerald-400 font-bold mb-1 block" data-i18n="usernameLabel">Username</label>
                <input type="text" id="reg-username-input" placeholder="Choose username..." class="w-full bg-gray-900 border border-emerald-500/30 p-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-400">
            </div>
            <div>
                <label class="text-[10px] text-emerald-400 font-bold mb-1 block" data-i18n="emailLabel">Email Address</label>
                <input type="email" id="reg-email-input" placeholder="Enter your email..." class="w-full bg-gray-900 border border-emerald-500/30 p-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-400">
            </div>
            <div>
                <label class="text-[10px] text-emerald-400 font-bold mb-1 block" data-i18n="invCodeLabel">Invitation Code (Optional)</label>
                <input type="text" id="reg-input-code" placeholder="Enter invitation code..." class="w-full bg-gray-900 border border-emerald-500/30 p-2.5 rounded-xl text-white font-mono font-bold focus:outline-none focus:border-emerald-400">
            </div>
            <div>
                <label class="text-[10px] text-emerald-400 font-bold mb-1 block" data-i18n="passwordLabel">Password</label>
                <input type="password" id="reg-pass-input" placeholder="Create password..." class="w-full bg-gray-900 border border-emerald-500/30 p-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-400">
            </div>
            <div>
                <label class="text-[10px] text-emerald-400 font-bold mb-1 block" data-i18n="confirmPassLabel">Confirm Password</label>
                <input type="password" id="reg-confirm-input" placeholder="Confirm password..." class="w-full bg-gray-900 border border-emerald-500/30 p-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-400">
            </div>
            <button onclick="handleUserRegister()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-xl text-xs shadow-lg shadow-emerald-500/20 active:scale-95 transition mt-2"
